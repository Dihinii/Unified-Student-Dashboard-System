<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Student Dashboard</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS v3 via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                        primaryHover: '#4338ca', // Indigo 700
                        darkBg: '#0f172a', // Slate 900
                        glass: 'rgba(255, 255, 255, 0.05)',
                        glassBorder: 'rgba(255, 255, 255, 0.1)'
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS (for animations) -->
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="bg-darkBg text-slate-200 font-sans h-screen flex flex-col overflow-hidden selection:bg-primary selection:text-white">

    <!-- Navbar -->
    <header class="flex justify-between items-center p-4 lg:px-8 border-b border-indigo-400/30 bg-black z-50 shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg overflow-hidden flex items-center justify-center shadow-lg shadow-indigo-500/30 bg-white">
                <img th:src="@{/images/logo.jpg}" alt="Logo" class="w-full h-full object-cover">
            </div>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400 tracking-tight">Unified Student Dashboard</h1>
        </div>

        <div id="auth-section" class="flex gap-3">
            <button onclick="showView('login-view')" class="px-4 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white transition-colors duration-200">Log in</button>
            <button onclick="showView('signup-view')" class="px-4 py-2 rounded-md text-sm font-medium bg-primary hover:bg-primaryHover text-white shadow-lg shadow-primary/30 transition-all duration-200 hover:scale-105 active:scale-95">Sign up</button>
        </div>

        <div id="user-greeting" class="hidden flex items-center gap-4">
            <div class="flex flex-col text-right">
                <span class="text-xs text-slate-400">Welcome back,</span>
                <span id="username-display" class="text-sm font-semibold text-white"></span>
            </div>
            <div class="w-10 h-10 rounded-full bg-slate-700 border-2 border-primary/50 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 border-r border-glassBorder bg-slate-900/30 flex flex-col p-4 gap-2">
            <button onclick="showView('home-view')" class="flex items-center gap-3 w-full px-4 py-3 text-left rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-all group">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-400 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span class="font-medium">Home Dashboard</span>
            </button>
            <button onclick="showView('add-task-view')" id="add-task-btn" class="flex items-center gap-3 w-full px-4 py-3 text-left rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-all group">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                <span class="font-medium">Add New Task</span>
            </button>
            <button id="urgency-btn" class="flex items-center gap-3 w-full px-4 py-3 text-left rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-all group">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-rose-400 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <span class="font-medium">Urgency Profile</span>
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-8 bg-slate-900/50 relative">
            
            <!-- Login View -->
            <section id="login-view" class="view-section hidden flex items-center justify-center h-full">
                <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-lg border border-glassBorder rounded-2xl p-8 shadow-2xl shadow-black/50 fade-in">
                    <h2 class="text-2xl font-bold text-white mb-6 text-center">Welcome Back</h2>
                    <form id="login-form" class="flex flex-col gap-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Username</label>
                            <input type="text" id="login-username" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Password</label>
                            <input type="password" id="login-password" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                        </div>
                        <div class="flex gap-3 mt-2">
                            <button type="submit" class="flex-1 bg-primary hover:bg-primaryHover text-white font-medium py-2.5 rounded-lg shadow-lg shadow-primary/30 transition-all hover:scale-[1.02] active:scale-[0.98]">Login</button>
                            <button type="button" onclick="showView('home-view')" class="px-6 bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 rounded-lg transition-colors">Cancel</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Signup View -->
            <section id="signup-view" class="view-section hidden flex items-center justify-center h-full">
                <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-lg border border-glassBorder rounded-2xl p-8 shadow-2xl shadow-black/50 fade-in">
                    <h2 class="text-2xl font-bold text-white mb-6 text-center">Create an Account</h2>
                    <form id="signup-form" class="flex flex-col gap-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Username</label>
                            <input type="text" id="signup-username" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Email</label>
                            <input type="email" id="signup-email" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Password</label>
                            <input type="password" id="signup-password" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                        </div>
                        <div class="flex gap-3 mt-2">
                            <button type="submit" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-medium py-2.5 rounded-lg shadow-lg shadow-emerald-500/30 transition-all hover:scale-[1.02] active:scale-[0.98]">Sign Up</button>
                            <button type="button" onclick="showView('home-view')" class="px-6 bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 rounded-lg transition-colors">Cancel</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Home View (3 Columns) -->
            <section id="home-view" class="view-section fade-in h-full flex flex-col">
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-white tracking-tight">Your Dashboard</h2>
                    <p class="text-slate-400 mt-1">Manage your academic and personal life in one place.</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1 min-h-0">
                    <!-- Column 1 -->
                    <div class="relative rounded-2xl border border-glassBorder overflow-hidden flex flex-col h-full group/col">
                        <!-- Background Image -->
                        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover/col:scale-105" style="background-image: url('/images/assignments.jpg');"></div>
                        <!-- Dark Overlay -->
                        <div class="absolute inset-0 bg-slate-900/80 group-hover/col:bg-slate-900/70 transition-colors"></div>
                        
                        <!-- Content -->
                        <div class="relative z-10 p-5 flex flex-col h-full">
                            <div class="flex items-center gap-3 mb-5 pb-3 border-b border-slate-700/50">
                                <div class="w-8 h-8 rounded-full bg-indigo-500/80 flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                    </svg>
                                </div>
                                <h3 class="text-lg font-bold text-white drop-shadow-md">Assignments</h3>
                            </div>
                            <div id="assignment-list" class="flex-1 overflow-y-auto pr-2 space-y-3 custom-scrollbar">
                                <!-- Tasks injected here -->
                            </div>
                        </div>
                    </div>

                    <!-- Column 2 -->
                    <div class="relative rounded-2xl border border-glassBorder overflow-hidden flex flex-col h-full group/col">
                        <!-- Background Image -->
                        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover/col:scale-105" style="background-image: url('/images/clubs.jpg');"></div>
                        <!-- Dark Overlay -->
                        <div class="absolute inset-0 bg-slate-900/80 group-hover/col:bg-slate-900/70 transition-colors"></div>
                        
                        <!-- Content -->
                        <div class="relative z-10 p-5 flex flex-col h-full">
                            <div class="flex items-center gap-3 mb-5 pb-3 border-b border-slate-700/50">
                                <div class="w-8 h-8 rounded-full bg-emerald-500/80 flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                    </svg>
                                </div>
                                <h3 class="text-lg font-bold text-white drop-shadow-md">Clubs & Work</h3>
                            </div>
                            <div id="clubs-list" class="flex-1 overflow-y-auto pr-2 space-y-3 custom-scrollbar">
                                <!-- Tasks injected here -->
                            </div>
                        </div>
                    </div>

                    <!-- Column 3 -->
                    <div class="relative rounded-2xl border border-glassBorder overflow-hidden flex flex-col h-full group/col">
                        <!-- Background Image -->
                        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover/col:scale-105" style="background-image: url('/images/personal.jpg');"></div>
                        <!-- Dark Overlay -->
                        <div class="absolute inset-0 bg-slate-900/80 group-hover/col:bg-slate-900/70 transition-colors"></div>
                        
                        <!-- Content -->
                        <div class="relative z-10 p-5 flex flex-col h-full">
                            <div class="flex items-center gap-3 mb-5 pb-3 border-b border-slate-700/50">
                                <div class="w-8 h-8 rounded-full bg-rose-500/80 flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                    </svg>
                                </div>
                                <h3 class="text-lg font-bold text-white drop-shadow-md">Personal</h3>
                            </div>
                            <div id="personal-list" class="flex-1 overflow-y-auto pr-2 space-y-3 custom-scrollbar">
                                <!-- Tasks injected here -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Add Task View -->
            <section id="add-task-view" class="view-section hidden max-w-2xl mx-auto py-4 fade-in">
                <div class="bg-slate-800/80 backdrop-blur-lg border border-glassBorder rounded-2xl p-8 shadow-2xl shadow-black/50">
                    <h2 id="form-title" class="text-2xl font-bold text-white mb-6 border-b border-slate-700 pb-4">Add New Task</h2>
                    
                    <form id="task-form" class="space-y-6">
                        <input type="hidden" id="task-id">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-slate-400 mb-1">Task Name</label>
                                <input type="text" id="task-name" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-400 mb-1">Date</label>
                                <input type="date" id="task-date" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all [color-scheme:dark]">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-400 mb-1">Time</label>
                                <input type="time" id="task-time" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all [color-scheme:dark]">
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-slate-400 mb-1">Task Category</label>
                                <div class="relative">
                                    <select id="task-type" class="w-full appearance-none bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all cursor-pointer">
                                        <option value="Assignment" class="bg-slate-800 text-cyan-400 font-bold">Assignment</option>
                                        <option value="Clubs" class="bg-slate-800 text-amber-400 font-bold">Clubs & Society</option>
                                        <option value="Personal" class="bg-slate-800 text-pink-400 font-bold">Personal</option>
                                    </select>
                                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Dynamic Fields Area -->
                        <div class="p-5 bg-slate-900/40 rounded-xl border border-slate-700/50 mt-4">
                            <!-- Assignment Specific -->
                            <div id="assignment-fields" class="dynamic-field space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-400 mb-1">Subject Name</label>
                                    <input type="text" id="subject-name" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
                                </div>
                            </div>
                            
                            <!-- Clubs Specific -->
                            <div id="clubs-fields" class="dynamic-field hidden space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-400 mb-1">Club Name</label>
                                    <input type="text" id="club-name" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-400 mb-1">Responsibility / Role</label>
                                    <input type="text" id="responsibility-type" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
                                </div>
                            </div>

                            <!-- Personal Specific -->
                            <div id="personal-fields" class="dynamic-field hidden space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-400 mb-1">Description</label>
                                    <textarea id="description" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"></textarea>
                                </div>
                                <label class="flex items-center gap-3 cursor-pointer group p-2 hover:bg-slate-800 rounded-lg transition-colors w-max">
                                    <div class="relative flex items-center">
                                        <input type="checkbox" id="is-recurring" class="peer sr-only">
                                        <div class="w-10 h-6 bg-slate-700 rounded-full peer-checked:bg-primary transition-colors"></div>
                                        <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-4 shadow-sm"></div>
                                    </div>
                                    <span class="text-sm font-medium text-slate-300 group-hover:text-white">Is Recurring Routine?</span>
                                </label>
                            </div>
                        </div>

                        <div class="flex gap-4 pt-4 border-t border-slate-700">
                            <button type="submit" class="flex-1 bg-primary hover:bg-primaryHover text-white font-medium py-3 rounded-lg shadow-lg shadow-primary/30 transition-all hover:-translate-y-0.5 active:translate-y-0">Save Task</button>
                            <button type="button" onclick="showView('home-view')" class="px-8 bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-lg transition-colors">Cancel</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Urgency Profile View -->
            <section id="urgency-view" class="view-section hidden h-full flex flex-col fade-in">
                <div class="mb-6 flex justify-between items-end">
                    <div>
                        <h2 class="text-3xl font-bold text-white tracking-tight">Urgency Profile</h2>
                        <p class="text-slate-400 mt-1">Smart sorting based on deadlines and importance.</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 flex-1 min-h-0">
                    
                    <!-- Pending Sorted Tasks -->
                    <div class="flex flex-col h-full bg-slate-800/40 border border-glassBorder rounded-2xl p-6">
                        <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-orange-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
                            </svg>
                            Action Required
                        </h3>
                        <div id="urgency-list" class="flex-1 overflow-y-auto pr-2 space-y-3 custom-scrollbar">
                            <!-- Tasks injected via JS -->
                        </div>
                    </div>

                    <!-- Completed Tasks -->
                    <div class="flex flex-col h-full bg-slate-800/20 border border-glassBorder border-dashed rounded-2xl p-6">
                        <h3 class="text-xl font-bold text-slate-400 mb-4 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                            </svg>
                            Completed History
                        </h3>
                        <div id="completed-list" class="flex-1 overflow-y-auto pr-2 space-y-3 custom-scrollbar opacity-80">
                            <!-- Tasks injected via JS -->
                        </div>
                    </div>

                </div>
            </section>

        </main>
    </div>

    <script th:src="@{/script.js}"></script>
</body>
</html>
